name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  script-boundaries:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test tests/script-compiler.test.mjs tests/script-files.test.mjs

  bootstrap:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned Rust for browser kernel
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - run: npm ci
      - run: npm run check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - run: cargo +1.90.0 fmt --check
      - run: cargo +1.90.0 clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +1.90.0 test --locked --workspace
      - run: cargo +1.90.0 check --locked -p axiom-core --target wasm32-unknown-unknown

  csharp-wasm-spike:
    timeout-minutes: 20
    strategy:
      matrix:
        mode: [development, aot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install wasm-tools
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/csharp-spike.mjs
        env:
          AXIOM_CSHARP_MODE: ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csharp-runtime-spike-${{ matrix.mode }}
          path: .axiom/csharp-spike-evidence

  browser-milestones:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned Rust for browser kernel
        run: rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Install software Vulkan and virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libvulkan1 mesa-vulkan-drivers
      - run: xvfb-run -a -s "-screen 0 1440x1000x24" npm run test:browser
        env:
          AXIOM_HEADLESS: "false"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milestone-browser-evidence
          path: |
            .axiom/browser-evidence
            .axiom/browser-m3-evidence
