name: CI

on:
  # Milestone branches are tested through their PR once, rather than again on push.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer revision supersedes an older run of the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  script-boundaries:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test tests/script-compiler.test.mjs tests/script-files.test.mjs

  bootstrap:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned Rust for browser kernel
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - run: npm ci
      - run: npm run check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - run: cargo +1.90.0 fmt --check
      - name: Collect formatting correction when needed
        if: failure()
        run: |
          cargo +1.90.0 fmt
          mkdir -p .axiom
          git diff > .axiom/rustfmt.patch
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rustfmt-correction
          path: .axiom/rustfmt.patch
      - run: cargo +1.90.0 clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +1.90.0 test --locked --workspace
      - run: cargo +1.90.0 check --locked -p axiom-core --target wasm32-unknown-unknown

  csharp-wasm-spike:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: development
          - os: ubuntu-latest
            mode: aot
          - os: windows-latest
            mode: development
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install wasm-tools
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/generate-script-bindings.mjs --check
      - run: node tests/browser/csharp-spike.mjs
        env:
          AXIOM_CSHARP_MODE: ${{ matrix.mode }}
      - run: node tests/browser/csharp-gameplay.mjs
        env:
          AXIOM_CSHARP_MODE: ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csharp-runtime-spike-${{ matrix.os }}-${{ matrix.mode }}
          path: .axiom/csharp-spike-evidence

  browser-milestones:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Isolated runners: parallel browser jobs do not share GPU or scene state.
      max-parallel: 8
      matrix:
        milestone: [corrections, m9, m2, m3, m4, m5, m6, m7, m8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned Rust for browser kernel
        run: rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-dotnet@v4
        if: contains(fromJSON('["m4","m6","m7"]'), matrix.milestone)
        with:
          global-json-file: global.json
      - run: dotnet workload install wasm-tools
        if: contains(fromJSON('["m4","m6","m7"]'), matrix.milestone)
      - run: npm run build
      - name: Install software Vulkan and virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libvulkan1 mesa-vulkan-drivers
      - run: node scripts/benchmarks/causal-diagnostics.mjs
        if: matrix.milestone == 'm8'
      - run: node scripts/benchmarks/renderer.mjs
        if: matrix.milestone == 'm9'
      - run: node scripts/benchmarks/physics.mjs
        if: matrix.milestone == 'm7'
      - name: Run isolated browser acceptance
        run: xvfb-run -a -s "-screen 0 1700x1100x24" node tests/browser/${{ matrix.milestone }}.mjs
        env:
          AXIOM_HEADLESS: "false"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milestone-browser-evidence-${{ matrix.milestone }}
          path: |
            .axiom/browser-evidence
            .axiom/browser-m3-evidence
            .axiom/browser-m4-evidence
            .axiom/browser-m5-evidence
            .axiom/browser-m6-evidence
            .axiom/browser-m7-evidence
            .axiom/browser-corrections-evidence
            .axiom/browser-m9-evidence
            .axiom/browser-m8-evidence
            dist/editor/axiom-kernel.wasm
            .axiom/physics-benchmark.json
            .axiom/causal-benchmark.json
            .axiom/renderer-benchmark.json
