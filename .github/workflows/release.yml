name: Prepared product release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Krozzeo/AxiomPlatform
          ref: 6e8e05d3934e649df1fb89228b3bac2965d37018
          path: .release-platform
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact release tag
        shell: pwsh
        run: |
          $version = node -p "JSON.parse(require('fs').readFileSync('package.json')).version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/package version mismatch' }
      - run: rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
      - run: rustup default 1.90.0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install wasm-tools
      - run: npm ci --no-audit --no-fund
      - name: Require versioned release notes
        shell: pwsh
        run: |
          $version = node -p "JSON.parse(require('fs').readFileSync('package.json')).version"
          if (-not (Test-Path -LiteralPath "docs/releases/$version.md")) { throw 'Missing release notes' }
      - run: npm run check
      - run: node .release-platform/scripts/prepare-release.mjs . .axiom/release
      - name: Publish prepared artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME .axiom/release/*.zip .axiom/release/axiom-release.json --verify-tag --title "Axiom Game Engine $env:GITHUB_REF_NAME" --notes-file "docs/releases/$($env:GITHUB_REF_NAME.Substring(1)).md"
