name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  source-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish source release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          notes="docs/releases/${tag#v}.md"
          if [ ! -f "$notes" ]; then
            echo "Missing release notes: $notes"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; preserving it."
            exit 0
          fi
          gh release create "$tag" --verify-tag --title "Axiom Engine $tag" --notes-file "$notes" --prerelease
